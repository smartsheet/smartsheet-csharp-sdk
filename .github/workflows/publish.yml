name: Publish Nuget Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v6
    - name: Setup .Net Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'
    - name: Install Dependencies
      run: dotnet restore
    - name: Build
      working-directory: ./
      run: dotnet build --configuration Release --no-restore
    - name: Checkout smartsheet-sdk-tests
      uses: actions/checkout@v6
      with:
        repository: smartsheet/smartsheet-sdk-tests
        path: smartsheet-sdk-tests
    - name: Setup Mock API
      run: |
        docker compose -f smartsheet-sdk-tests/docker-compose.yml up -d --wait
    - name: Run Mock API Tests
      working-directory: ./mock-api-test-sdk-net80
      run: |
        dotnet test --no-restore
    - name: Package
      working-directory: ./smartsheet-csharp-sdk
      run: dotnet pack smartsheet-csharp-sdk-v2.csproj --no-build --configuration Release --include-symbols -p:SymbolPackageFormat=snupkg -o .
    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Publish to Nuget
      working-directory: ./smartsheet-csharp-sdk
      run: dotnet nuget push *.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json" --skip-duplicate
